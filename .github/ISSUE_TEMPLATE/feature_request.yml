name: Feature request
description: Suggest a focused improvement to the SDK
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What game-development problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like and include a usage example when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any effect on existing games, browsers, or the portal protocol.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for similar requests.
          required: true
        - label: I am willing to help implement or test this change.
          required: false
